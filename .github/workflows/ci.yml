name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      # The browser secret helper builds against libsecret during install and tests.
      - name: Install system libraries
        run: |
          sudo apt-get update -o Acquire::Languages=none
          sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      - name: Cache Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Format and lint
        run: vp check

      - name: Typecheck
        run: vp run typecheck

      # Server and web browser suites are left to `vp run check:changed` locally.
      - name: Unit tests
        run: |
          vp run --parallel --concurrency-limit 4 \
            --filter '!t3' --filter '!@t3tools/monorepo' \
            --filter '!@t3tools/web' --filter '!@t3tools/server' test
          vp run --filter @t3tools/web exec vp test run --passWithNoTests --project unit
