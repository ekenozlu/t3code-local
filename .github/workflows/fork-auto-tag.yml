# Forks only: every push to main gets the next patch tag, which the Mac updater in
# scripts/mac-self-update builds and installs. Upstream releases through release.yml instead.
name: Fork auto tag

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fork-auto-tag
  cancel-in-progress: false

jobs:
  tag:
    if: github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Tag the next patch version
        run: |
          stable='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if git tag --points-at HEAD | grep -qE "$stable"; then
            echo "HEAD is already tagged."
            exit 0
          fi
          latest="$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -E "$stable" | head -n1 || true)"
          if [[ -z "$latest" ]]; then
            latest="v$(node -p "require('./apps/desktop/package.json').version.split('-')[0]")"
            next="$latest"
          else
            IFS=. read -r major minor patch <<<"${latest#v}"
            next="v$major.$minor.$((patch + 1))"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" -m "$(git log -1 --format=%s)"
          git push origin "$next"
          echo "Tagged $next" >>"$GITHUB_STEP_SUMMARY"
